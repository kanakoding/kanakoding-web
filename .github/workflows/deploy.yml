name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_DOMAIN: kanakoding.com
  KEEP_RELEASES: 5

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kanakoding.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          BASE="/var/www/${SITE_DOMAIN}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --link-dest="$BASE/current/" \
            --chmod=D2775,F664 \
            dist/ "$VPS_USER@$VPS_HOST:$BASE/releases/$RELEASE/"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$SITE_DOMAIN" "$RELEASE" "$KEEP_RELEASES" <<'EOF'
          set -euo pipefail
          BASE="/var/www/$1"; REL="$BASE/releases/$2"; KEEP="$3"
          test -f "$REL/index.html"
          ln -sfn "$REL" "$BASE/current.tmp"
          mv -Tf "$BASE/current.tmp" "$BASE/current"
          cd "$BASE/releases"
          ls -1t | grep -v '^initial$' | tail -n +"$((KEEP + 1))" | xargs -r rm -rf --
          echo "Active release: $(readlink "$BASE/current")"
          EOF

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/?v=${GITHUB_SHA::7}") || true
            echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
